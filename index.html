<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F1E7D6;--kraft:#D9C5A6;--kraft-dk:#CBB58F;--kraft-dker:#BBA378;--terra:#AC5A38;--clay:#C67F5C;--ink:#6B5A48;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100dvh;background:radial-gradient(130% 90% at 50% 12%,#F7EFE1,#EBDFCB 60%,#E2D4BB);
  color:var(--ink);font-family:"Jost",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 18px;overflow-x:hidden}

.stage{perspective:1300px;position:relative;width:min(340px,82vw);
  display:flex;align-items:center;justify-content:center;cursor:pointer}

.env{position:relative;width:300px;max-width:82vw;aspect-ratio:1.5/1;
  transition:opacity .55s ease .4s,transform .7s ease .4s;z-index:2}
.stage.open .env{opacity:0;transform:translateY(28%) scale(.93);pointer-events:none}

.pocket{position:absolute;inset:0;border-radius:9px;overflow:hidden;background:var(--kraft);
  box-shadow:0 22px 42px -18px rgba(74,59,48,.5),inset 0 0 0 1px rgba(74,59,48,.06);z-index:4}
.pocket::before{content:"";position:absolute;inset:0;
  background:linear-gradient(48deg,var(--kraft-dk) 0 50%,transparent 50%) bottom left/50% 100% no-repeat,
            linear-gradient(-48deg,var(--kraft-dk) 0 50%,transparent 50%) bottom right/50% 100% no-repeat;opacity:.5}
.pocket::after{content:"";position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(180deg,rgba(74,59,48,.10),transparent)}

.flap{position:absolute;left:0;top:0;width:100%;height:66%;transform-origin:top;transform:rotateX(0);
  transition:transform .7s ease,z-index 0s linear .35s;z-index:6}
.flap svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(74,59,48,.16))}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--clay),var(--terra) 70%);z-index:7;
  box-shadow:0 4px 10px rgba(74,59,48,.35),inset 0 0 0 2px rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:#F6E9DF;font-size:19px;
  transition:opacity .35s ease,transform .5s ease}
.stage.open .flap{transform:rotateX(-176deg);z-index:1}
.stage.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}

.card{position:absolute;left:50%;top:50%;height:min(78vh,540px);aspect-ratio:1024/1536;
  transform:translate(-50%,-44%) scale(.42);opacity:0;z-index:5;border-radius:9px;
  box-shadow:0 30px 60px -22px rgba(74,59,48,.55);perspective:1800px;
  transition:opacity .7s ease .45s,transform .95s cubic-bezier(.2,.85,.2,1) .45s}
.stage.open .card{opacity:1;transform:translate(-50%,-50%) scale(1)}

.card-inner{position:relative;width:100%;height:100%;cursor:pointer;
  transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.15,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}

.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:9px;overflow:hidden}
.card-face img{width:100%;height:100%;object-fit:cover;display:block}

.card-back{transform:rotateY(180deg);
  background:linear-gradient(165deg,var(--ivory),var(--kraft) 140%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10%;box-shadow:inset 0 0 0 1px rgba(74,59,48,.1)}
.back-mark{font-family:"Pinyon Script",cursive;font-size:30px;color:var(--terra);margin-bottom:14px}
.rsvp-btn{display:inline-block;margin-top:6px;padding:12px 34px;border-radius:999px;
  border:1px solid var(--terra);color:var(--terra);text-decoration:none;
  font-family:"Jost",sans-serif;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
  transition:background .25s ease,color .25s ease}
.rsvp-btn:hover{background:var(--terra);color:var(--ivory)}

.flip-hint{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink);opacity:.5}

.hint{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);white-space:nowrap;
  font-family:"Pinyon Script",cursive;font-size:23px;color:var(--terra);
  transition:opacity .35s ease;animation:breathe 2.4s ease-in-out infinite;z-index:3}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.stage.open .hint{opacity:0;pointer-events:none}

.replay{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:none;border:none;
  color:var(--ink);font-family:"Jost",sans-serif;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  cursor:pointer;opacity:.55;padding:8px 12px}
.replay:hover{opacity:1}
.replay[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .env,.card,.flap,.seal{transition-duration:.01ms!important}.hint{animation:none}
}
</style>
</head>

<script>
const stage=document.getElementById("stage"),replay=document.getElementById("replay"),
  card=document.getElementById("card"),cardInner=document.getElementById("cardInner");
function open(){if(stage.classList.contains("open"))return;stage.classList.add("open");setTimeout(()=>replay.hidden=false,1500);}
function close(){stage.classList.remove("open");replay.hidden=true;card.classList.remove("flipped");}
stage.addEventListener("click",open);
stage.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
replay.addEventListener("click",close);
cardInner.addEventListener("click",e=>{
  if(!stage.classList.contains("open"))return;
  if(e.target.closest(".rsvp-btn"))return;
  card.classList.toggle("flipped");
});
</script>
