<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F1E7D6;--kraft:#D9C5A6;--kraft-dk:#CBB58F;--kraft-dker:#BBA378;--terra:#AC5A38;--clay:#C67F5C;--ink:#6B5A48;--charcoal:#4A3B30;--olive:#5B6B45;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100dvh;background:radial-gradient(130% 90% at 50% 12%,#F7EFE1,#EBDFCB 60%,#E2D4BB);
  color:var(--ink);font-family:"Jost",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 18px;overflow-x:hidden}

.stage{perspective:1300px;position:relative;width:min(340px,82vw);
  display:flex;align-items:center;justify-content:center;cursor:pointer}

.env{position:relative;width:300px;max-width:82vw;aspect-ratio:1.5/1;
  transition:opacity .55s ease .4s,transform .7s ease .4s;z-index:2}
.stage.open .env{opacity:0;transform:translateY(28%) scale(.93);pointer-events:none}

.pocket{position:absolute;inset:0;border-radius:9px;overflow:hidden;background:var(--kraft);
  box-shadow:0 22px 42px -18px rgba(74,59,48,.5),inset 0 0 0 1px rgba(74,59,48,.06);z-index:4}
.pocket::before{content:"";position:absolute;inset:0;
  background:linear-gradient(48deg,var(--kraft-dk) 0 50%,transparent 50%) bottom left/50% 100% no-repeat,
            linear-gradient(-48deg,var(--kraft-dk) 0 50%,transparent 50%) bottom right/50% 100% no-repeat;opacity:.5}
.pocket::after{content:"";position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(180deg,rgba(74,59,48,.10),transparent)}

.flap{position:absolute;left:0;top:0;width:100%;height:66%;transform-origin:top;transform:rotateX(0);
  transition:transform .7s ease,z-index 0s linear .35s;z-index:6}
.flap svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(74,59,48,.16))}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--clay),var(--terra) 70%);z-index:7;
  box-shadow:0 4px 10px rgba(74,59,48,.35),inset 0 0 0 2px rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:#F6E9DF;font-size:19px;
  transition:opacity .35s ease,transform .5s ease}
.stage.open .flap{transform:rotateX(-176deg);z-index:1}
.stage.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}

.card{position:absolute;left:50%;top:50%;height:min(78vh,540px);aspect-ratio:1024/1536;
  transform:translate(-50%,-44%) scale(.42);opacity:0;z-index:5;border-radius:9px;
  box-shadow:0 30px 60px -22px rgba(74,59,48,.55);perspective:1800px;
  container-type:inline-size;
  transition:opacity .5s ease,transform .6s cubic-bezier(.4,0,.2,1)}
.stage.open .card{animation:cardPop 1.05s cubic-bezier(.2,.7,.2,1) .42s both}

@keyframes cardPop{
  0%{opacity:0;transform:translate(-50%,-38%) scale(.32) rotate(-5deg)}
  45%{opacity:1;transform:translate(-50%,-56%) scale(1.07) rotate(2deg)}
  68%{transform:translate(-50%,-48%) scale(.97) rotate(-1deg)}
  85%{transform:translate(-50%,-51%) scale(1.015) rotate(.4deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
}

.card-inner{position:relative;width:100%;height:100%;cursor:pointer;
  transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.15,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}

.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:9px;overflow:hidden}
.card-face img{width:100%;height:100%;object-fit:cover;display:block}

.card-front{background-size:cover;background-position:center}
.front-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:21% 15% 23%;color:var(--charcoal)}
.ft-title{font-family:"Pinyon Script",cursive;color:var(--terra);
  font-size:clamp(30px,11.5cqw,46px);line-height:1.05}
.ft-heart{font-size:clamp(9px,3cqw,13px);color:var(--terra);margin:5px 0}
.ft-sub{font-family:"Jost",sans-serif;font-weight:600;text-transform:uppercase;color:var(--charcoal);
  font-size:clamp(10px,3.6cqw,14px);letter-spacing:.22em;margin-top:2px}
.ft-orn{font-size:clamp(8px,2.8cqw,11px);letter-spacing:.3em;color:var(--olive);margin:7px 0}
.ft-note{font-family:"Jost",sans-serif;text-transform:uppercase;color:var(--terra);
  font-size:clamp(7px,2.3cqw,9px);letter-spacing:.15em;margin-bottom:11px}
.ft-say{font-family:"Jost",sans-serif;font-weight:600;text-transform:uppercase;color:var(--charcoal);
  font-size:clamp(9px,3.3cqw,13px);letter-spacing:.22em}
.ft-jo{font-family:"Pinyon Script",cursive;color:var(--olive);
  font-size:clamp(24px,10cqw,38px);margin:0 0 9px}
.ft-date{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.8cqw,12px);
  color:var(--terra);margin-bottom:10px}
.ft-bar{opacity:.45;font-weight:300;font-size:clamp(16px,6cqw,24px)}
.ft-day{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(20px,7.8cqw,30px);line-height:1}
.ft-my{font-family:"Jost",sans-serif;text-transform:uppercase;line-height:1.35;text-align:left;
  font-size:clamp(8px,2.8cqw,11px);letter-spacing:.12em}
.ft-official{font-family:"Pinyon Script",cursive;color:var(--terra);line-height:1.3;margin-top:7px;
  font-size:clamp(12px,4.4cqw,16px)}

.card-back{transform:rotateY(180deg);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10%;box-shadow:inset 0 0 0 1px rgba(74,59,48,.1)}
.back-mark{font-family:"Pinyon Script",cursive;font-size:30px;color:var(--terra);margin-bottom:14px}
.rsvp-btn{display:inline-block;margin-top:6px;padding:12px 34px;border-radius:999px;
  border:1px solid var(--terra);color:var(--terra);text-decoration:none;
  font-family:"Jost",sans-serif;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
  transition:background .25s ease,color .25s ease}
.rsvp-btn:hover{background:var(--terra);color:var(--ivory)}

.flip-hint{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink);opacity:.5}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

.hint{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);white-space:nowrap;
  font-family:"Pinyon Script",cursive;font-size:23px;color:var(--terra);
  transition:opacity .35s ease;animation:breathe 2.4s ease-in-out infinite;z-index:3}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.stage.open .hint{opacity:0;pointer-events:none}

.replay{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:none;border:none;
  color:var(--ink);font-family:"Jost",sans-serif;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  cursor:pointer;opacity:.55;padding:8px 12px}
.replay:hover{opacity:1}
.replay[hidden]{display:none}

</style>
</head>

<script>
const stage=document.getElementById("stage"),replay=document.getElementById("replay"),
  card=document.getElementById("card"),cardInner=document.getElementById("cardInner"),
  confettiCanvas=document.getElementById("confetti"),confettiCtx=confettiCanvas.getContext("2d");
let confettiRAF=null;
function resizeConfetti(){confettiCanvas.width=innerWidth;confettiCanvas.height=innerHeight;}
addEventListener("resize",resizeConfetti);
resizeConfetti();
function burstConfetti(){
  const colors=["#AC5A38","#C67F5C","#D9C5A6","#BBA378","#8C9A6B","#E7C98F","#F1E7D6","#D4AF37"];
  const originY=confettiCanvas.height*.38;
  const isMobile=matchMedia("(max-width:480px)").matches;
  const count=isMobile?130:190;
  const origins=[confettiCanvas.width*.5,confettiCanvas.width*.28,confettiCanvas.width*.72];
  const pieces=Array.from({length:count},()=>{
    const originX=origins[Math.floor(Math.random()*origins.length)];
    const angle=Math.PI+Math.random()*Math.PI,speed=4+Math.random()*8.5;
    return{x:originX+(Math.random()-.5)*50,y:originY,
      vx:Math.cos(angle)*speed*.65+(Math.random()-.5)*3.5,
      vy:-Math.abs(Math.sin(angle))*speed-3,
      g:.2+Math.random()*.13,size:4+Math.random()*6,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.4,
      shape:Math.random()<.5?"rect":"circle",life:1,decay:.0038+Math.random()*.0042};
  });
  cancelAnimationFrame(confettiRAF);
  function tick(){
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    let alive=false;
    for(const p of pieces){
      if(p.life<=0)continue;
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.decay;
      if(p.y>confettiCanvas.height+30||p.life<=0)continue;
      alive=true;
      confettiCtx.save();
      confettiCtx.globalAlpha=Math.max(p.life,0);
      confettiCtx.translate(p.x,p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.fillStyle=p.color;
      if(p.shape==="rect")confettiCtx.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);
      else{confettiCtx.beginPath();confettiCtx.arc(0,0,p.size/2,0,Math.PI*2);confettiCtx.fill();}
      confettiCtx.restore();
    }
    if(alive)confettiRAF=requestAnimationFrame(tick);
    else confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }
  tick();
}
function open(){if(stage.classList.contains("open"))return;stage.classList.add("open");setTimeout(()=>replay.hidden=false,1500);
  setTimeout(burstConfetti,420);}
function close(){stage.classList.remove("open");replay.hidden=true;card.classList.remove("flipped");
  cancelAnimationFrame(confettiRAF);confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);}
stage.addEventListener("click",open);
stage.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
replay.addEventListener("click",close);
cardInner.addEventListener("click",e=>{
  if(!stage.classList.contains("open"))return;
  if(e.target.closest(".rsvp-btn"))return;
  card.classList.toggle("flipped");
});
</script>
